<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03050a">
  <title>Neon Calc – Kalkulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <section class="calc" aria-label="Kalkulator">
      <header class="bar">
        <h1 class="brand">Neon Calc</h1>
        <div class="bar-actions">
          <button id="historyToggle" class="icon-btn history-toggle" type="button"
                  aria-label="Buka riwayat" aria-expanded="false" aria-controls="history">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </button>
          <button id="themeToggle" class="icon-btn" type="button" aria-label="Ganti mode gelap atau terang">
            <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </header>

      <div class="display">
        <div id="expression" class="expr"></div>
        <output id="result" class="result">0</output>
      </div>

      <div class="keypad" id="keypad">
        <button class="key fn"  type="button" data-k="ac"  aria-label="Hapus semua">AC</button>
        <button class="key fn"  type="button" data-k="del" aria-label="Hapus angka terakhir">DEL</button>
        <button class="key fn"  type="button" data-k="sq"  aria-label="Pangkat dua">x<sup>2</sup></button>
        <button class="key fn"  type="button" data-k="rt"  aria-label="Akar kuadrat">√</button>

        <button class="key" type="button" data-k="7">7</button>
        <button class="key" type="button" data-k="8">8</button>
        <button class="key" type="button" data-k="9">9</button>
        <button class="key op" type="button" data-k="/" aria-label="Bagi">÷</button>

        <button class="key" type="button" data-k="4">4</button>
        <button class="key" type="button" data-k="5">5</button>
        <button class="key" type="button" data-k="6">6</button>
        <button class="key op" type="button" data-k="*" aria-label="Kali">×</button>

        <button class="key" type="button" data-k="1">1</button>
        <button class="key" type="button" data-k="2">2</button>
        <button class="key" type="button" data-k="3">3</button>
        <button class="key op" type="button" data-k="-" aria-label="Kurang">−</button>

        <button class="key" type="button" data-k="0">0</button>
        <button class="key" type="button" data-k="." aria-label="Titik desimal">.</button>
        <button class="key op" type="button" data-k="%" aria-label="Persen">%</button>
        <button class="key op" type="button" data-k="+" aria-label="Tambah">+</button>

        <button class="key eq" type="button" data-k="=" aria-label="Hitung">=</button>
      </div>
    </section>

    <div class="scrim" id="scrim"></div>

    <aside class="history" id="history" aria-label="Riwayat perhitungan">
      <div class="h-head">
        <h2>Riwayat</h2>
        <div class="h-actions">
          <button id="clearHistory" class="text-btn" type="button">Hapus semua</button>
          <button id="closeHistory" class="icon-btn close-only" type="button" aria-label="Tutup riwayat">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <ul id="historyList" class="h-list"></ul>
    </aside>

  </main>

  <noscript><p class="noscript">Kalkulator ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
